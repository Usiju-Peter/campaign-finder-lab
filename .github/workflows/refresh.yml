name: Refresh campaigns

on:
  schedule:
    - cron: "47 */4 * * *"   # every 4 hours (UTC), at :47 so it never overlaps the main site's :17 run
  workflow_dispatch: {}      # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          npm ci
          npx playwright@$(node -p "require('playwright-core/package.json').version") install --with-deps chromium

      - name: Scrape campaign list
        run: node scraper/scrape.js list

      - name: Pick campaigns to open
        run: python scraper/build.py candidates

      - name: Scrape campaign pages
        run: node scraper/scrape.js details

      - name: Build dashboard data
        run: python scraper/build.py build

      - name: Commit new data
        run: |
          git config user.name "Usiju-Peter"
          git config user.email "133090530+Usiju-Peter@users.noreply.github.com"
          git add public/data data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh campaign data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --quiet
          git push
